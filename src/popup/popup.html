<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Steward</title>
  <link rel="stylesheet" href="../ui.css">
</head>
<body class="popup">
  <div class="header">
    <div class="row">
      <h1 class="grow">Tab Steward</h1>
      <span id="provider" class="chip" title="Model provider"></span>
      <button id="preview" class="small" title="Show what Tidy would do, without doing it">Preview</button>
      <button id="tidy" class="primary small" title="Alt+Shift+T">Tidy now</button>
      <button id="undo" class="small" title="Alt+Shift+Z">Undo</button>
      <div class="menu" id="more">
        <button class="icon" id="more-btn" title="More">⋯</button>
        <div class="menu-list">
          <button data-open="rethink">Rethink all groups (model)</button>
          <button data-open="options">Settings & policy</button>
          <button data-open="attic">Attic & activity log</button>
          <button data-open="page">Open as a full page</button>
          <button data-open="sidebar">Open in sidebar</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="ask" type="text" class="grow" placeholder="Find, or tell the steward: “merge the two Firefox groups”" autocomplete="off">
      <button id="ask-btn" class="small" title="Send this instruction to the steward (Enter)">Go</button>
    </div>
  </div>
  <div class="section quick" id="quick">
    <button data-quick="cleanup" title="Close leftovers and duplicates, then group what is ungrouped (Alt+Shift+C)">Clean up</button>
    <button data-quick="dedupe" title="Close duplicate tabs only">Dedupe</button>
    <button data-quick="group" title="Group ungrouped tabs only">Group</button>
    <button data-quick="sleepAll" title="Unload every tab except the active, pinned and playing ones">Sleep all</button>
    <button data-quick="minimise" title="Collapse every group and sleep idle tabs (Alt+Shift+M)">Minimise</button>
    <button data-quick="expandAll" title="Expand every group">Expand all</button>
    <button data-quick="closeStale" title="Close every tab that is past its staleness threshold (to the Attic)">Close stale</button>
  </div>
  <div id="onboard" class="section" hidden></div>
  <div id="focus" class="section" hidden></div>
  <div id="answer" class="section" hidden></div>
  <div id="plan" class="section" hidden></div>
  <div id="digest" class="section"></div>
  <div id="suggestions" class="section"></div>
  <div id="groups" class="section"></div>
  <div id="hidden" class="section"></div>
  <div id="tabs" class="section"></div>
  <div id="projects" class="section"></div>
  <div id="footer" class="section muted" style="padding-bottom:12px"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
